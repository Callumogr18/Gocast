<div>
  <h3>{{.Name}}</h3>
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Min</th>
        <th>Max</th>
        <th>Weather</th>
        <th>Wind</th>
        <th>Rain (6-18)</th>
        <th>Rain (18-6)</th>
      </tr>
    </thead>
    <tbody>
      {{range .Days}}
      <tr>
        <td>{{.Date}}</td>
        <td>{{.MinTemp}}&deg;</td>
        <td>{{.MaxTemp}}&deg;</td>
        <td>{{.WeatherLabel}}</td>
        <td>{{.Wind}} {{.WindDir}}</td>
        <td>{{.Rainfall6To18}}mm</td>
        <td>{{.Rainfall18To6}}mm</td>
      </tr>
      {{end}}
    </tbody>
  </table>
</div>
