<!doctype html>
<html lang="en">
  <head>
    <script
      src="https://unpkg.com/htmx.org@1.9.10"
      integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
      crossorigin="anonymous"
    ></script>
    <meta charset="UTF-8" />
    <title>Gocast</title>
  </head>
  <body>
    <h1>Gocast</h1>

    <h2>National Forecast</h2>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <button
      hx-get="/national"
      hx-trigger="confirmed"
      onClick="Swal.fire({title: 'Confirm', text:'Do you want to continue?'}).then((result)=>{
      if(result.isConfirmed){
                  htmx.trigger(this, 'confirmed');  
                } 
            })"
    >
      Click Me
    </button>

    <h2>Regional Forecast</h2>
    <select name="province" hx-get="/regional" hx-trigger="change" hx-target="#regional-result">
      <option value="" disabled selected>Select a province</option>
      <option value="Connacht">Connacht</option>
      <option value="Leinster">Leinster</option>
      <option value="Munster">Munster</option>
      <option value="Ulster">Ulster</option>
    </select>
    <div id="regional-result"></div>

    <h2>County Forecast</h2>
    <select name="county" hx-get="/county" hx-trigger="change" hx-target="#county-result">
      <option value="" disabled selected>Select a county</option>
      <option value="Antrim">Antrim</option>
      <option value="Armagh">Armagh</option>
      <option value="Carlow">Carlow</option>
      <option value="Cavan">Cavan</option>
      <option value="Clare">Clare</option>
      <option value="Cork">Cork</option>
      <option value="Derry">Derry</option>
      <option value="Donegal">Donegal</option>
      <option value="Down">Down</option>
      <option value="Dublin">Dublin</option>
      <option value="Fermanagh">Fermanagh</option>
      <option value="Galway">Galway</option>
      <option value="Kerry">Kerry</option>
      <option value="Kildare">Kildare</option>
      <option value="Kilkenny">Kilkenny</option>
      <option value="Laois">Laois</option>
      <option value="Leitrim">Leitrim</option>
      <option value="Limerick">Limerick</option>
      <option value="Longford">Longford</option>
      <option value="Louth">Louth</option>
      <option value="Mayo">Mayo</option>
      <option value="Meath">Meath</option>
      <option value="Monaghan">Monaghan</option>
      <option value="Offaly">Offaly</option>
      <option value="Roscommon">Roscommon</option>
      <option value="Sligo">Sligo</option>
      <option value="Tipperary">Tipperary</option>
      <option value="Tyrone">Tyrone</option>
      <option value="Waterford">Waterford</option>
      <option value="Westmeath">Westmeath</option>
      <option value="Wexford">Wexford</option>
      <option value="Wicklow">Wicklow</option>
    </select>
    <div id="county-result"></div>

    <script>
      document.body.addEventListener('htmx:responseError', function (e) {
        e.detail.target.innerHTML =
          '<p role="alert">' + e.detail.xhr.responseText + '</p>';
      });
    </script>
  </body>
</html>
